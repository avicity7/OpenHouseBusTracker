apiVersion: v1
kind: Service
metadata:
  name: opbt-frontend
  labels:
    app: opbt-frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5173
    protocol: TCP
    name: http
  selector:
    app: opbt-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opbt-ingress
  labels:
    app: opbt
spec:
  ingressClassName: nginx
  rules:
  - host: openhousebustracker.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: opbt-frontend
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: opbt-backend
            port:
              number: 3000